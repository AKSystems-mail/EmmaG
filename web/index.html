<!DOCTYPE html>
<html>
  <head>
    <!-- Standard meta tags -->
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A fun learning adventure for Emma and her friends.">
  
    <!-- iOS meta tags for PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Emma G">
  
    <!-- +++ THE FIX: This allows your app to draw into the status bar area +++ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
    <title>Emma G's Adventures</title>
    <link rel="manifest" href="manifest.json">
  
    <script>
      // The value below is injected by flutter build, do not touch.
      var serviceWorkerVersion = "{{flutter_service_worker_version}}";
    </script>
    <!-- This script installs the Flutter web engine -->
    <script src="flutter.js" defer></script>
  </head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
