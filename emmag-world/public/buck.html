const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
new GLTFLoader().parse(buf, "", g => {
  const B = {};
  g.scene.traverse(o => { B[o.name] = o;
    if (o.isMesh) { o.geometry.computeVertexNormals(); o.material.flatShading = true; o.material.needsUpdate = true; }});
  scene.add(g.scene); window.__bones = B;
  const box = new THREE.Box3();
  g.scene.traverse(o => { if (o.isMesh) { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox); }});
  const s = box.getSize(new THREE.Vector3());
  const skinned = Object.values(B).filter(o => o.isBone).length;
  document.title = "Buck " + s.x.toFixed(0) + "x" + s.z.toFixed(0) + "x" + s.y.toFixed(0) + "cm rig" + skinned;
  window.__loaded = true;
}, e => { document.title = "ERROR " + e; });

addEventListener("resize", () => {
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  r.setSize(innerWidth, innerHeight);
});
(function loop(){
  const t = performance.now() / 1000, B = window.__bones || {};
  // a slow nod, a wagging tail and a walking swing: proves the skin binds and deforms
  if (B.head) B.head.rotation.z = Math.sin(t * 1.1) * 0.06;
  if (B.neck) B.neck.rotation.z = Math.sin(t * 1.1) * 0.03;
  if (B.tail) B.tail.rotation.z = -0.2 + Math.sin(t * 2.6) * 0.22;
  for (const n of ["frontUpL", "frontUpR", "hindUpL", "hindUpR"])
    if (B[n]) B[n].rotation.z = Math.sin(t * 2.2 + (n.endsWith("R") ? Math.PI : 0)) * 0.2;
  requestAnimationFrame(loop); ctl.update(); r.render(scene, cam);
})();
